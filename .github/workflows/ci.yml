name: ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      # Runs every sample. Nothing asserts on the output, so this only catches a sample that
      # throws or stops compiling against the library it is meant to demonstrate - which is
      # exactly how the previous set came to be wrong without anyone noticing.
      - name: Run samples
        run: dotnet run --configuration Release --no-build --project samples/Circus.Examples

      - name: Generate coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
